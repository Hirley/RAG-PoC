[project]
name = "rag"
version = "0.1.0"
description = "Sistema RAG (Retrieval-Augmented Generation) em Python puro"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "minsearch>=0.0.2",
    "elasticsearch>=8.15.0",
    "anthropic>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
]

[tool.pytest.ini_options]
bdd_features_base_dir = "tests/features/"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
