[project]
name = "rag"
version = "0.1.0"
description = "Sistema RAG (Retrieval-Augmented Generation) em Python puro"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hirley Esmeraldo Ribeiro", email = "hirley@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "minsearch>=0.0.2",
    "elasticsearch>=8.15.0,<9.0.0",
    "anthropic>=0.34.0",
]

[project.urls]
Repository = "https://github.com/Hirley/RAG-PoC"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
]

[tool.pytest.ini_options]
bdd_features_base_dir = "tests/features/"
testpaths = ["tests"]
markers = [
    "integration: talks to a real ElasticSearch; skipped when none is reachable",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
