name: CI

on:
  push:
    branches: [main]
  # Runs for pull requests into any branch, not just main, so that stacked
  # pull requests are verified too. `reopened` covers a stale PR being picked
  # back up; `edited` covers a stacked PR being retargeted when its base
  # merges, which would otherwise leave it with no status check at all.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
